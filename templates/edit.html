<!DOCTYPE html>
<html>
<body>

<h1>Edit Booking</h1>

<form action="/update-booking" method="post">

    <label>Time:</label>
    <input type="time" name="time" value="{{ time }}" required>

    <br><br>

    <button type="submit">Update</button>

</form>

</body>
</html>
